_metadata:
  major_version: 2
display_information:
  name: Natural Markets
  description: Peer-to-peer Kalshi markets settled on Natural
  background_color: "#111111"
features:
  bot_user:
    display_name: Natural Markets
    always_online: true
oauth_config:
  scopes:
    bot: ["app_mentions:read", "channels:history", "channels:read", "chat:write", "groups:history", "im:history", "im:write", "reactions:write", "users:read", "users:read.email"]
settings:
  event_subscriptions:
    bot_events: [app_mention, message.channels, message.groups, message.im]
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
